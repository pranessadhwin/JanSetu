<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reports — JanSetu</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-nav"></div>

  <main class="container">
    <h1 class="page-title">My reported challenges</h1>
    <p class="page-subtitle">Track the status of the civic issues you've submitted.</p>

    <div id="alert-box"></div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Address</th>
            <th>Domain</th>
            <th>Routed to</th>
            <th>Status</th>
            <th>Submitted</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="challenges-body"></tbody>
      </table>
      <div id="empty-state" class="empty-state hidden">
        You haven't reported any challenges yet. <a href="submit-challenge.html">Report one now</a>.
      </div>
    </div>
  </main>

  <footer class="site-footer">JanSetu — Civic engagement platform</footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/my-challenges.js"></script>
</body>
</html>
