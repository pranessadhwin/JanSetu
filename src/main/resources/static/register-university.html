<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register as University — JanSetu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-nav"></div>

  <main class="container" style="max-width:600px;">
    <div class="page-header animate-in">
      <h1 class="page-title">Register your University</h1>
      <p class="page-subtitle">Create an admin account for your institution. A Super Admin must approve it before you can log in.</p>
    </div>

    <div class="card animate-in" style="animation-delay:.1s">
      <div class="card-header">
        <span class="card-icon" style="background:#f5eefc;">🎓</span>
        <h3>Institution Details</h3>
      </div>
      <div id="alert-box"></div>
      <form id="register-form" class="stacked">
        <div>
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" required placeholder="Admin contact person" />
        </div>
        <div>
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@university.edu" />
        </div>
        <div>
          <label for="phone">Phone <span class="muted" style="font-weight:400;">(optional)</span></label>
          <input type="tel" id="phone" name="phone" placeholder="+91 00000 00000" />
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" />
        </div>
        <div>
          <label for="university">Select University</label>
          <select id="university" name="university" required>
            <option value="">Loading universities…</option>
          </select>
        </div>
        <button type="submit" class="btn" id="register-submit" style="width:100%;margin-top:0.5rem;">Submit for Approval</button>
      </form>
    </div>

    <p class="help-text" style="text-align:center;margin-top:1rem;">
      Already registered? <a href="login.html">Sign in</a>
    </p>
  </main>

  <footer class="site-footer"><strong>JanSetu</strong> — Civic engagement platform &copy; 2025</footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/register-university.js"></script>
</body>
</html>
