<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — JanSetu</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-nav"></div>

  <main class="container">
    <h1 class="page-title">Login</h1>
    <p class="page-subtitle">Access your JanSetu account.</p>

    <div class="card" style="max-width:480px;">
      <div id="alert-box"></div>
      <form id="login-form" class="stacked">
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn" id="login-submit">Login</button>
      </form>
      <p class="help-text">New here? <a href="register.html">Create an account</a>.</p>
    </div>
  </main>

  <footer class="site-footer">JanSetu — Civic engagement platform</footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
