<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register as Citizen — JanSetu</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-nav"></div>

  <main class="container">
    <h1 class="page-title">Create a citizen account</h1>
    <p class="page-subtitle">Register to report civic challenges in your area.</p>

    <div class="card" style="max-width:480px;">
      <div id="alert-box"></div>
      <form id="register-form" class="stacked">
        <div>
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>
        <div>
          <label for="phone">Phone (optional)</label>
          <input type="tel" id="phone" name="phone" />
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" />
          <p class="help-text">At least 6 characters.</p>
        </div>
        <button type="submit" class="btn" id="register-submit">Create account</button>
      </form>
      <p class="help-text">Already registered? <a href="login.html">Login</a>.</p>
    </div>
  </main>

  <footer class="site-footer">JanSetu — Civic engagement platform</footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/register-citizen.js"></script>
</body>
</html>
